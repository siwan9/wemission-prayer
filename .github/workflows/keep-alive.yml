name: Supabase Keep Alive

on:
  schedule:
    # 하루 3회 실행, 정각 혼잡을 피하기 위해 17분에 실행 (UTC)
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Keep Supabase Alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -eu

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY secrets must be configured." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 5 \
            --retry-delay 10 \
            --connect-timeout 15 \
            --max-time 30 \
            "${SUPABASE_URL%/}/settings?select=current_camp_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
